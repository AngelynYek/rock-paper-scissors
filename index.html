<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>Rock, Paper, Scissors</h1>

    <div id="buttons">
        <button id="rock">Rock</button>

        <button id="scissors">Scissor</button>

    <div id="results">
        <p id="round-result">Make your move to start!</p>
        <p id="score">Player: 0 | Computer: 0</p>
        <h2 id="final-winner"></h2>
    </div>
    <script src="javascript.js"></script>
</body>
